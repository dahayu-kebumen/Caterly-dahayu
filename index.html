
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Caterly - Smart Catering OS</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg">
    <meta name="description" content="AI-powered platform to scale catering businesses through smart menu optimization and proactive customer outreach.">
    <meta property="og:title" content="Caterly - Smart Catering OS">
    <meta property="og:description" content="AI-powered platform to scale catering businesses through smart menu optimization and proactive customer outreach.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root { --amber-500: #f59e0b; }
      body { 
        font-family: 'Plus Jakarta Sans', sans-serif; 
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        color: #020617;
        overflow-x: hidden;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .custom-scrollbar::-webkit-scrollbar {
        width: 5px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #e2e8f0;
        border-radius: 10px;
        border: 1px solid transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #cbd5e1;
      }
      
      .logo-gradient {
        background: linear-gradient(135deg, #10b981 0%, #6366f1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
